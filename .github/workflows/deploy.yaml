name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.jar"
          target: "~/uploads"
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_JPA_HIBERNATE_DDLAUTO: "update"
          SPRING_JPA_SHOWSQL: "false"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,SPRING_JPA_HIBERNATE_DDLAUTO,SPRING_JPA_SHOWSQL

          script: |
            cd /opt/board-rest-jpa

            mv ~/uploads/*.jar app.jar

            if [ -f app.pid ]; then
              PID="$(cat app.pid)"
              kill $PID 2>/dev/null || true

              while kill -0 $PID 2>/dev/null
              do
                sleep 1
              done

              rm app.pid
            fi

            nohup java -jar app.jar > app.log 2>&1 < /dev/null &

            echo $! > app.pid
